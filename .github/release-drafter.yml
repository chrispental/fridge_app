name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION

categories:
  - title: "✨ Features"
    labels: [feature, enhancement]
  - title: "🐛 Fixes"
    labels: [fix, bug]
  - title: "🧹 Maintenance"
    labels: [chore, refactor, docs]
  - title: "📦 Dependencies"
    labels: [dependencies]

version-resolver:
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, chore, dependencies]
  default: patch

# PR titles in this repo follow feat:/fix:/chore:/docs:/design: prefixes —
# label them automatically so the draft categorizes itself.
autolabeler:
  - label: feature
    title: ["/^feat(\\(.*\\))?[:!]/i"]
  - label: fix
    title: ["/^fix(\\(.*\\))?[:!]/i"]
  - label: chore
    title: ["/^(chore|docs|design|refactor|test|ci|build)(\\(.*\\))?[:!]/i"]

change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'

template: |
  ## Changes

  $CHANGES
