name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Tests must run from backend/ — there is no conftest.py, so `app`
        # is only importable with backend/ as the working directory.
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest

  backend-tests-postgres:
    # Migrations + HTTP smoke against a real Postgres, the way cloud mode (Supabase) runs.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_migrations.py tests/test_app_smoke.py tests/test_mcp_tools.py

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Keep advisory details visible without turning unrelated dependency issues
      # into a feature-PR gate. The scheduled production-only audit is separate.
      - name: Report dependency advisories
        continue-on-error: true
        run: npm audit --json
      - run: npm run lint
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exercises the exact command users run; .env is optional in compose.
      - run: docker compose build

  local-mcp-browser:
    # Runs only synthetic data in a new loopback-only Docker stack. Browser and
    # Python dependencies stay inside containers, matching the local workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check fixed loopback publication
        env:
          FRIDGE_BIND_HOST: 0.0.0.0
          SUPABASE_URL: https://must-not-inherit.example
        run: |
          docker compose -f docker-compose.mcp-local.yml -p fridge-mcp-ci config --format json > /tmp/local-mcp-compose.json
          python - <<'PY'
          import json
          config = json.load(open('/tmp/local-mcp-compose.json'))
          assert all(port['host_ip'] == '127.0.0.1' for service in config['services'].values() for port in service.get('ports', []))
          assert config['services']['backend']['environment']['SUPABASE_URL'] == ''
          assert config['services']['frontend']['build']['args']['VITE_SUPABASE_URL'] == ''
          PY
      - name: Start isolated local stack
        run: docker compose -f docker-compose.mcp-local.yml -p fridge-mcp-ci up --build -d --wait
      - name: Seed disposable synthetic kitchen
        run: docker compose -f docker-compose.mcp-local.yml -p fridge-mcp-ci exec -T -e FRIDGE_SYNTHETIC_SMOKE=1 backend python -c "import runpy; runpy.run_path('tests/seed_local_mcp_smoke.py', run_name='__main__')"
      - name: Build browser check image
        run: docker build -f scripts/mcp-local-smoke.Dockerfile -t fridge-mcp-browser-check scripts
      - name: Check real HTTP and browser approval
        run: |
          mkdir -p /tmp/mcp-browser-artifacts
          docker run --rm --network host -v /tmp/mcp-browser-artifacts:/artifacts fridge-mcp-browser-check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: local-mcp-browser-screenshots
          path: /tmp/mcp-browser-artifacts
          if-no-files-found: ignore
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.mcp-local.yml -p fridge-mcp-ci logs --tail=100
      - name: Remove disposable stack and data
        if: always()
        run: |
          docker compose -f docker-compose.mcp-local.yml -p fridge-mcp-ci down --volumes --remove-orphans --rmi local
          docker image rm fridge-mcp-browser-check || true
