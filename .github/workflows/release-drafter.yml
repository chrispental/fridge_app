name: Release Drafter

on:
  push:
    branches: [main]
  # For the autolabeler on open PRs.
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v7
        # PR runs only autolabel (a convenience) and fail on forks / before
        # the config exists on main — don't let that red-X the PR.
        # Push-to-main runs (the actual release drafting) still fail loudly.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
