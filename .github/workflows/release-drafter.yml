name: Release Drafter

on:
  push:
    branches: [main]
  # For the autolabeler on open PRs.
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
