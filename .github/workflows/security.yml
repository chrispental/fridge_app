name: Security

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep the action's PR scan and explicitly scan all fetched history too.
  # A clean PR diff must not hide a secret on another fetched branch.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the PR's commits to scan them.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Scan all fetched history
        run: gitleaks detect --redact --log-opts="--all --full-history --diff-merges=first-parent" --config=.gitleaks.toml

  # Audit proposed dependencies on every PR, including Dependabot/forks, with
  # a read-only token and no application secrets. Also keep weekly/manual runs
  # to catch newly disclosed advisories between dependency updates.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pipx run --python "$(command -v python)" pip-audit -r backend/requirements.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Audit the committed production lockfile without running package scripts.
      - run: npm audit --omit=dev --audit-level=high
