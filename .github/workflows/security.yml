name: Security

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full-history secret scan. Runs on every PR (cheap, catches an accidental
  # key commit before merge) and weekly.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the PR's commits to scan them.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency audits are visibility, not gates: with fully pinned deps they
  # will eventually flag CVEs unrelated to any open PR, and Dependabot is the
  # fix mechanism. Schedule + manual runs only.
  pip-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run pip-audit -r backend/requirements.txt

  npm-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --omit=dev --audit-level=high
