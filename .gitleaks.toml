# Gitleaks config — extends the default ruleset with repo-specific allowlists.
# Picked up automatically by gitleaks (and the gitleaks-action CI job).

[extend]
useDefault = true

# design.pen is a machine-generated Pencil design file whose trailing
# "fileToken" is the document's own UUID, not a credential. The generic-api-key
# rule trips on the "token" keyword + UUID entropy. Both conditions must match,
# so real secrets in design.pen (or fileTokens elsewhere) still get flagged.
# Use a rule-specific allowlist: CI's Gitleaks 8.24.3 does not support the
# global [[allowlists]] syntax (introduced in 8.25.0).
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Pencil design file document id"
condition = "AND"
regexTarget = "line"
paths = ['''^design\.pen$''']
regexes = ['''"fileToken": "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''']

# Verified synthetic HS256 rejection fixture from commit
# 2e4ef75eab54bd95fade6c07b2fce48b9b5b0adc (PR #61, still unmerged).
# The fixture now generates its key in memory. Full-history scans still see
# the old literal; allow only that entire line in that exact test path.
# Do not exempt the commit, other keys, JWTs, or the whole test directory.
[[rules.allowlists]]
description = "Historical synthetic MCP rejection-test key"
condition = "AND"
regexTarget = "line"
paths = ['''^backend/tests/test_mcp_auth\.py$''']
regexes = ['''^\s*secret = "synthetic-test-secret-with-at-least-32-bytes"\s*$''']
