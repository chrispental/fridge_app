# Alembic config. The DB URL is NOT set here — `alembic/env.py` reads it from
# `app.config.settings.database_url` (i.e. the DATABASE_URL env var), so the CLI and
# the app always migrate the same database.
#
#   cd backend && alembic upgrade head
#   cd backend && alembic revision --autogenerate -m "add thing"
[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
