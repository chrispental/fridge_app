services:
  backend:
    build: ./backend
    container_name: fridge_backend
    env_file:
      # Optional so a fresh clone (or CI) can still `docker compose build`;
      # the app boots keyless and degrades gracefully without API keys.
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      # DB file + uploaded images persist here, survive container rebuilds.
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Cloud mode only; substituted from .env. Empty defaults keep
        # `docker compose build` working with no .env at all.
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-}"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${VITE_SUPABASE_PUBLISHABLE_KEY:-}"
    container_name: fridge_frontend
    ports:
      # Open the app at http://localhost:8080
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
