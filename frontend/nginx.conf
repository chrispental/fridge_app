# Per-address edge protection, including unauthenticated MCP traffic.
limit_req_zone $binary_remote_addr zone=mcp_requests:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow reasonably large fridge photos through to the backend.
    client_max_body_size 15M;

    # Proxy API calls to the backend service (same Docker network).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI calls can take a while.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Optional MCP must never fall through to the SPA. Disabled backend returns 404.
    location = /mcp {
        limit_req zone=mcp_requests burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # SPA fallback — all other routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
